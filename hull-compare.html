<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hull Variant Compare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root { --bg: #eef2f5; --panel: #ffffff; --ink: #17212b; --muted: #5b6b78; --line: #d6dee5; --accent: #0f6c8f; --accent-ink: #ffffff; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', system-ui, sans-serif; }
      #layout { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
      aside { background: var(--panel); border-right: 1px solid var(--line); padding: 18px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
      h1 { font-size: 17px; margin: 0; font-weight: 600; }
      .sub { font-size: 12.5px; color: var(--muted); margin: 4px 0 0; line-height: 1.45; }
      .label { font: 500 11px 'IBM Plex Mono', monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
      .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; background: #fff; text-align: left; width: 100%; font: inherit; color: inherit; }
      .card + .card { margin-top: 8px; }
      .card[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
      .card b { font-size: 14px; font-weight: 600; display: block; }
      .card span { font-size: 12px; color: var(--muted); line-height: 1.4; display: block; margin-top: 3px; }
      .card .stats { font: 400 11px 'IBM Plex Mono', monospace; color: var(--accent); margin-top: 6px; }
      .seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
      .seg button { flex: 1; border: 0; background: #fff; padding: 7px 4px; font: 500 12.5px 'IBM Plex Sans', sans-serif; cursor: pointer; color: var(--ink); }
      .seg button + button { border-left: 1px solid var(--line); }
      .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
      .row { display: flex; flex-wrap: wrap; gap: 6px; }
      .row button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 5px 9px; font: 500 12px 'IBM Plex Sans', sans-serif; cursor: pointer; }
      .row button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
      a.open { display: block; text-align: center; background: var(--accent); color: var(--accent-ink); text-decoration: none; border-radius: 7px; padding: 9px; font-weight: 600; font-size: 13.5px; }
      #view { position: relative; min-height: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #status { position: absolute; left: 14px; bottom: 12px; font: 400 12px 'IBM Plex Mono', monospace; color: var(--muted); background: rgba(255,255,255,.8); padding: 4px 8px; border-radius: 5px; }
      @media (max-width: 760px) {
        #layout { grid-template-columns: 1fr; grid-template-rows: auto 60vh; height: auto; }
        aside { border-right: 0; border-bottom: 1px solid var(--line); padding: 14px 16px; }
        #view { height: 60vh; }
      }
    </style>
  </head>
  <body>
    <div id="layout">
      <aside>
        <div>
          <h1>Hull variant compare</h1>
          <p class="sub">Switch hulls with the camera held still. "In-app glass" applies the simulator's translucent styling; "X-ray" hides plating, decks and the house to show the internals.</p>
        </div>
        <div>
          <div class="label">Variant</div>
          <div id="variants"></div>
        </div>
        <div>
          <div class="label">Look</div>
          <div class="seg" id="modes">
            <button data-mode="textured" aria-pressed="true">Textured</button>
            <button data-mode="glass" aria-pressed="false">In-app glass</button>
            <button data-mode="xray" aria-pressed="false">X-ray</button>
          </div>
        </div>
        <div>
          <div class="label">Camera</div>
          <div class="row" id="cams">
            <button data-cam="bow">Bow ¾</button>
            <button data-cam="stern">Stern ¾</button>
            <button data-cam="profile">Profile</button>
            <button data-cam="plan">Plan</button>
            <button data-cam="under">Underside</button>
            <button data-cam="house">House</button>
          </div>
        </div>
        <a class="open" id="open" href="./?hull=v8c">Open in simulator</a>
      </aside>
      <main id="view"><div id="status">loading…</div></main>
    </div>
    <script type="module" src="/src/tools/hull-compare.ts"></script>
  </body>
</html>
